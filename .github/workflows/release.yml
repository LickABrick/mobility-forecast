name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly approve publishing the merged release PR at main HEAD
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: controlled-release
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: quality
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require preparation credential
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo '::error::Release preparation did not run. Configure repository Actions secret RELEASE_PLEASE_TOKEN (fine-grained PAT: Contents, Pull requests and Issues read/write). See docs/developer/repository-setup.md.'
            exit 1
          fi
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          skip-github-release: true
  publish:
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Read authoritative publication metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" > /tmp/repository.json
          gh api "repos/$GITHUB_REPOSITORY/commits/main" > /tmp/head.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&per_page=100" > /tmp/prs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/tags?per_page=100" > /tmp/tags.json
          python - <<'PY'
          import json
          def load(name):
              with open('/tmp/' + name + '.json') as stream:
                  return json.load(stream)
          snapshot = {name: load(name) for name in ('repository', 'head')}
          snapshot.update({name: [item for page in load(name) for item in page] for name in ('prs', 'tags')})
          with open('/tmp/candidate.json', 'w') as stream:
              json.dump(snapshot, stream)
          PY
      - name: Validate exact release candidate before any writes
        env:
          PUBLISH_APPROVED: ${{ inputs.publish }}
        run: python scripts/check_release_candidate.py --snapshot /tmp/candidate.json
      - name: Reject last-minute branch movement
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: main
          skip-github-pull-request: true
