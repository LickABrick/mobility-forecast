name: Release
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish pending merged release PR after protected-environment approval
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: ${{ github.ref_name }}
          skip-github-release: true
  publish:
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: python scripts/check_release.py --tag "v$(cat version.txt)"
      - name: Reject branch movement after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/commits/${{ github.ref_name }} --jq .sha)" = "${{ github.sha }}"
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: ${{ github.ref_name }}
          skip-github-pull-request: true
