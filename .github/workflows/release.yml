name: Release
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish pending merged release PR after protected-environment approval
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: quality
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: ${{ github.ref_name }}
          skip-github-release: true
  publish:
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: python scripts/check_release.py --tag "v$(cat version.txt)"
      - name: Reject branch movement after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/commits/${{ github.ref_name }} --jq .sha)" = "${{ github.sha }}"
      - name: Require one pending release PR at the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls?state=closed&base=${{ github.ref_name }}&per_page=100" > /tmp/release-prs.json
          python - <<'PY'
          import json, os
          with open('/tmp/release-prs.json') as stream:
              prs = json.load(stream)
          pending = [pr for pr in prs if pr['merged_at'] and any(label['name'] == 'autorelease: pending' for label in pr['labels'])]
          assert len(pending) == 1, 'Expected exactly one pending merged release PR'
          assert pending[0]['merge_commit_sha'] == os.environ['EXPECTED_SHA'], 'Validate and publish the release PR commit, not a later commit'
          PY
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: ${{ github.ref_name }}
          skip-github-pull-request: true
