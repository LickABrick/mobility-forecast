get_history:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: mobility_forecast
    days:
      default: 30
      selector:
        number:
          min: 1
          max: 365
          mode: box
get_forecast:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: mobility_forecast
    days:
      default: 30
      selector:
        number:
          min: 1
          max: 365
          mode: box

get_ev_plan:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: mobility_forecast
    horizon_days:
      default: 7
      selector:
        number:
          min: 1
          max: 7
          mode: box

sync_now:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: mobility_forecast
